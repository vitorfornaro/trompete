<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#F6F4EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1C1B" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/trompete/favicon.svg" />
    <!-- app instalável no iPhone (Adicionar à Tela de Início) -->
    <link rel="apple-touch-icon" href="/trompete/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trompete" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Sopra</title>
    <script>
      (function () {
        var m = window.matchMedia("(prefers-color-scheme: dark)");
        // tema escolhido em Configurações (src/hooks/use-settings.tsx), aplicado antes do app carregar
        try {
          var tema = JSON.parse(localStorage.getItem("ajustes-v1") || "{}").tema;
          if (tema === "claro" || tema === "escuro") document.documentElement.setAttribute("data-theme", tema === "escuro" ? "dark" : "light");
        } catch (e) {}
        function apply() {
          var t = document.documentElement.getAttribute("data-theme");
          document.documentElement.classList.toggle("dark", t ? t === "dark" : m.matches);
        }
        apply();
        m.addEventListener("change", apply);
        new MutationObserver(apply).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      })();
    </script>
    <script type="module" crossorigin src="/trompete/assets/index-Bit2dG2s.js"></script>
    <link rel="stylesheet" crossorigin href="/trompete/assets/index-Bn9v6kVb.css">
  <link rel="manifest" href="/trompete/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/trompete/registerSW.js"></script></head>
  <body>
    <div id="root"></div>
  </body>
</html>
